version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: meu_usuario
      POSTGRES_PASSWORD: minha_senha
      POSTGRES_DB: meu_banco
    ports:
      - "5432:5432"

  sgbd_manager:
    image: dbgate/dbgate
    ports:
      - "3000:3000"
    environment:
      CONNECTIONS: postgresql://meu_usuario:minha_senha@db:5432/meu_banco
